name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KMAIL_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "KMAIL_KEYSTORE_B64 secret is missing"
            exit 1
          }

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kmail-release.jks"

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RE='^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$'

          FILE_VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [[ ! "$FILE_VERSION" =~ $RE ]]; then
            echo "Invalid VERSION_NAME in version.properties: $FILE_VERSION"
            exit 1
          fi

          # Highest version already released as a tag (empty if none).
          TAG_VERSIONS=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/kmail-v" \
            --paginate --jq '.[].ref' \
            | sed 's#refs/tags/kmail-v##' \
            | grep -E "$RE" || true)

          # Start from whichever is higher: the file or the latest tag.
          BASE=$(printf '%s\n%s\n' "$FILE_VERSION" "$TAG_VERSIONS" | sed '/^$/d' | sort -V | tail -1)
          echo "Base version: $BASE"

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))

          if (( PATCH >= 99 )); then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=1
          else
            PATCH=$((PATCH + 1))
          fi

          if (( MAJOR > 99 )); then
            echo "Major version would exceed 99"
            exit 1
          fi

          NAME="${MAJOR}.${MINOR}.${PATCH}"
          TAG="kmail-v${NAME}"

          # Safety net: never reuse a tag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "Release tag already exists: $TAG"
            exit 1
          fi

          # Gradle reads versionName and versionCode from this file.
          echo "VERSION_NAME=${NAME}" > version.properties

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NAME"

      - name: Test and build signed release APK and AAB
        env:
          KMAIL_KEYSTORE_PATH: ${{ runner.temp }}/kmail-release.jks
          KMAIL_KEYSTORE_PASSWORD: ${{ secrets.KMAIL_KEYSTORE_PASSWORD }}
          KMAIL_KEY_ALIAS: ${{ secrets.KMAIL_KEY_ALIAS }}
          KMAIL_KEY_PASSWORD: ${{ secrets.KMAIL_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            testDebugUnitTest \
            assembleRelease \
            bundleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)

          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/*.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kmail-release.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: kmail-v${{ steps.version.outputs.name }}-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -type f | head -1)

          test -n "$APK" || { echo "APK not found"; exit 1; }
          test -n "$AAB" || { echo "AAB not found"; exit 1; }

          APK_NAME="kmail-v${VERSION_NAME}.apk"
          AAB_NAME="kmail-v${VERSION_NAME}.aab"

          cp "$APK" "$APK_NAME"
          cp "$AAB" "$AAB_NAME"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest \
            --title "Kmail v${VERSION_NAME}" \
            "$APK_NAME" \
            "$AAB_NAME"

          echo "Successfully published Kmail v${VERSION_NAME}"

      - name: Commit version bump
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -f -B main origin/main

          echo "VERSION_NAME=${VERSION_NAME}" > version.properties
          git add version.properties
          git diff --cached --quiet && exit 0

          git commit -m "chore: release v${VERSION_NAME} [skip ci]"
          git push origin main
