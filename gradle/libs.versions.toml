[versions]
agp = "9.5.1"
kotlin = "2.3.21"
ksp = "2.3.13"
hilt = "2.60.1"
room = "2.8.5"
junit = "4.13.2"
jakartaMailApi = "2.1.5"
angusActivation = "2.0.3"
angusMail = "2.0.5"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
navigation = "2.10.2"
coroutines = "1.11.0"
lifecycle = "2.11.0"
